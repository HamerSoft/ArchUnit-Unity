name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: EditMode tests (Unity 2021.3.0f1 LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: test-package

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: test-package
          unityVersion: 2021.3.0f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results
          artifactsPath: editmode-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode test results
          path: editmode-artifacts

  # A Unity 7 (CoreCLR) job was attempted here but dropped: game-ci's unityci/editor
  # Docker image registry has no images for any Unity 7000.x alpha build yet (checked
  # Docker Hub directly - 0 tags matching "7000"), so there's nothing to pull in CI.
  # Revisit once game-ci or Unity ships something CI-friendly for the 7.x alpha channel.
